# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    fairino5_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fairino5_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
    # Require measured tracking and final arrival; zero defaults disable checks.
    open_loop_control: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.0
      j1: {trajectory: 0.20, goal: 0.02}
      j2: {trajectory: 0.20, goal: 0.02}
      j3: {trajectory: 0.20, goal: 0.02}
      j4: {trajectory: 0.20, goal: 0.02}
      j5: {trajectory: 0.20, goal: 0.02}
      j6: {trajectory: 0.20, goal: 0.02}
