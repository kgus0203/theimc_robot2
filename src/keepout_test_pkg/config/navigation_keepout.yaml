# Display-only standalone costmap configuration.
# This intentionally contains no planner, controller, velocity smoother, or behavior server.
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: keepout_test_base
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.06
      track_unknown_space: true
      rolling_window: false
      always_send_full_costmap: true
      footprint: "[[0.61, 0.47], [0.61, -0.47], [-0.61, -0.47], [-0.61, 0.47]]"
      footprint_padding: 0.03

      plugins: ["static_layer", "inflation_layer"]
      filters: ["keepout_filter", "keepout_inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.75

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.5

      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

    # Required by Costmap2DROS even though no sensor layer is used.
      observation_sources: ""
